name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build, Lint, Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run release planner unit tests
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: Build container image
        run: make docker-build

      - name: Check formatting
        run: make fmt-check

      - name: Run linters and type checks
        run: make lint

      - name: Run test suites
        run: make test

      - name: Build release binary
        run: make build

  cross-platform:
    name: Cross-Platform (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
          package-manager-cache: false

      - name: Setup Rust toolchain
        # zizmor: ignore[superfluous-actions]
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.target }}
          components: clippy

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --ignore-scripts

      - name: Build embedded Web Canvas SPA
        run: npm --prefix frontend run build

      - name: Run Clippy
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: cargo clippy --workspace --all-targets --all-features --locked --target "$CARGO_BUILD_TARGET" -- -D warnings

      - name: Run Rust workspace tests
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: cargo test --workspace --locked --target "$CARGO_BUILD_TARGET"
