name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Optional explicit SemVer release version (X.Y.Z, without leading v)
        required: false
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.calc.outputs.should_release }}
      tag: ${{ steps.calc.outputs.tag }}
      version: ${{ steps.calc.outputs.version }}
      previous_tag: ${{ steps.calc.outputs.previous_tag }}
    steps:
      - name: Enforce release branch guard
        if: github.ref != 'refs/heads/main'
        env:
          ACTUAL_REF: ${{ github.ref }}
        run: |
          echo "::error::Releases may only run from refs/heads/main (got '${ACTUAL_REF}')." >&2
          exit 1

      - name: Checkout repository with full tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Run release planner unit tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: Compute next SemVer release tag
        id: calc
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/ci/compute_next_release_tag.py \
            --release-version "${RELEASE_VERSION:-}" \
            --github-output "$GITHUB_OUTPUT"

  verify:
    name: Verify Quality Gates
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo and npm build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/imgforge
          key: imgforge-cache-${{ runner.os }}-${{ hashFiles('Dockerfile', 'Cargo.lock', 'frontend/package-lock.json') }}
          restore-keys: |
            imgforge-cache-${{ runner.os }}-

      - name: Build builder container and run fmt, lint, and tests
        run: make docker-build && make fmt-check && make lint && make test

  build:
    name: Build (${{ matrix.target }})
    needs: [plan, verify]
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: imgforge
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: imgforge
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_name: imgforge
          - os: macos-14
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            bin_name: imgforge
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_name: imgforge.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
          package-manager-cache: false

      - name: Setup Rust toolchain
        # zizmor: ignore[superfluous-actions]
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.target }}

      - name: Cache Cargo workspace
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: release-${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --ignore-scripts

      - name: Build embedded Web Canvas SPA
        run: npm --prefix frontend run build

      - name: Build release binary
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          IMGFORGE_BUILD_VERSION: ${{ needs.plan.outputs.version }}
        run: cargo build --release --locked --target "$CARGO_BUILD_TARGET"

      - name: Verify embedded binary version on native runners
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.bin_name }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          os_name="$(uname -s)"
          arch_name="$(uname -m)"
          is_native="false"
          case "${os_name}:${arch_name}:${CARGO_BUILD_TARGET}" in
            Linux:x86_64:x86_64-unknown-linux-gnu) is_native="true" ;;
            Linux:aarch64:aarch64-unknown-linux-gnu) is_native="true" ;;
            Darwin:arm64:aarch64-apple-darwin) is_native="true" ;;
            Darwin:x86_64:x86_64-apple-darwin) is_native="true" ;;
            MINGW*:x86_64:x86_64-pc-windows-msvc|MSYS*:x86_64:x86_64-pc-windows-msvc|CYGWIN*:x86_64:x86_64-pc-windows-msvc) is_native="true" ;;
          esac

          if [ "$is_native" = "true" ]; then
            bin_path="target/${CARGO_BUILD_TARGET}/release/${BIN_NAME}"
            version_out="$("$bin_path" --version)"
            echo "Verified native binary version: $version_out"
            if [[ "$version_out" != *"$RELEASE_VERSION"* ]]; then
              echo "::error::Expected '--version' output '$version_out' to contain '$RELEASE_VERSION'" >&2
              exit 1
            fi
          else
            echo "Skipping '--version' execution on cross-compiled target ${CARGO_BUILD_TARGET} (${os_name}/${arch_name})."
          fi

      - name: Package release archive (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          BIN_NAME: ${{ matrix.bin_name }}
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/pkg-${CARGO_BUILD_TARGET}"
          rm -rf "$stage"
          mkdir -p "$stage" dist
          cp "target/${CARGO_BUILD_TARGET}/release/${BIN_NAME}" "${stage}/${BIN_NAME}"
          chmod 0755 "${stage}/${BIN_NAME}"
          cp LICENSE README.md "$stage/"
          archive="dist/imgforge-${RELEASE_TAG}-${CARGO_BUILD_TARGET}.tar.gz"
          tar -C "$stage" -czf "$archive" "$BIN_NAME" LICENSE README.md
          tar -tzf "$archive" | grep -qx "$BIN_NAME"

      - name: Package release archive (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          BIN_NAME: ${{ matrix.bin_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "pkg-$env:CARGO_BUILD_TARGET"
          if (Test-Path $stage) {
            Remove-Item -Recurse -Force $stage
          }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\$env:CARGO_BUILD_TARGET\release\$env:BIN_NAME" (Join-Path $stage $env:BIN_NAME)
          Copy-Item "LICENSE" (Join-Path $stage "LICENSE")
          Copy-Item "README.md" (Join-Path $stage "README.md")
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $archive = "dist\imgforge-$env:RELEASE_TAG-$env:CARGO_BUILD_TARGET.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $archive -Force

      - name: Upload release archive artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/imgforge-${{ needs.plan.outputs.tag }}-${{ matrix.target }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [plan, build]
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # Create release tag and upload GitHub Release assets
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download built release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Verify archives and generate SHA256SUMS.txt
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          expected_files=(
            "imgforge-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
            "imgforge-${RELEASE_TAG}-aarch64-unknown-linux-gnu.tar.gz"
            "imgforge-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz"
            "imgforge-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz"
            "imgforge-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip"
          )
          for file in "${expected_files[@]}"; do
            if [ ! -f "dist/${file}" ]; then
              echo "::error::Missing expected release archive: dist/${file}" >&2
              exit 1
            fi
          done
          (
            cd dist
            LC_ALL=C sha256sum "${expected_files[@]}" > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Verify no tag conflict and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::Tag '${RELEASE_TAG}' already exists in Git history." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release '${RELEASE_TAG}' already exists." >&2
            exit 1
          fi

          notes_args=(--generate-notes)
          if [ -n "${PREVIOUS_TAG:-}" ]; then
            notes_args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          gh release create "$RELEASE_TAG" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TAG" \
            "${notes_args[@]}" \
            "dist/imgforge-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/imgforge-${RELEASE_TAG}-aarch64-unknown-linux-gnu.tar.gz" \
            "dist/imgforge-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz" \
            "dist/imgforge-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz" \
            "dist/imgforge-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip" \
            "dist/SHA256SUMS.txt" \
            "scripts/install.sh" \
            "scripts/install.ps1"
