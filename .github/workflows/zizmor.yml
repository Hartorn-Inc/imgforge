concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}

jobs:
  gate:
    uses: Giskard-AI/giskard-actions/.github/workflows/zizmor-scan.yml@00ab9dbab2d6d9bc71f39d412300787be4d1b45d # v2.4.1
    permissions:
      contents: read
